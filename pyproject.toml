[tool.poetry]
name = "spendlytics"
version = "0.1.0"
description = ""
authors = ["Igor Nunes Patricio"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
  "black (>=25.9.0,<26.0.0)",
  "ruff (>=0.14.1,<0.15.0)",
  "pre-commit (>=4.3.0,<5.0.0)",
]

[tool.black]
line-length = 88 # Max characters per line
target-version = ['py311'] # Python version to target
include = '\.pyi?$' # Files to format (*.py, *.pyi)
extend-exclude = '''
/(
  # directories to exclude
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".eggs", ".git", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "C901"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
